<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SunchaserVerse</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050818;
  font-family: Arial, sans-serif;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 45%,
      #101936 0%,
      #080d20 45%,
      #03050d 100%);
}

/* LIGHT */

#sunGlow {
  position: absolute;
  width: 430px;
  height: 280px;
  left: 55%;
  top: 25%;
  transform: translate(-50%, -50%);
  border-radius: 50%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,188,72,.36) 0%,
      rgba(245,157,46,.18) 28%,
      rgba(230,184,63,.07) 50%,
      rgba(230,184,63,0) 72%
    );

  filter: blur(30px);
  pointer-events: none;
  z-index: 0;
}

#sunCore {
  position: absolute;
  width: 105px;
  height: 105px;
  left: 55%;
  top: 25%;
  transform: translate(-50%, -50%);
  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,245,1) 0%,
      rgba(255,244,188,.98) 15%,
      rgba(255,196,76,.78) 35%,
      rgba(255,155,45,.32) 58%,
      rgba(255,155,45,0) 78%
    );

  filter: blur(8px);

  box-shadow:
    0 0 28px rgba(255,235,165,.60),
    0 0 65px rgba(255,176,55,.30);

  pointer-events: none;
  z-index: 0;
}

#sunFlare {
  position: absolute;
  width: 330px;
  height: 18px;
  left: 55%;
  top: 25%;
  transform: translate(-50%, -50%);

  background:
    linear-gradient(
      90deg,
      rgba(255,184,65,0),
      rgba(255,205,100,.16),
      rgba(255,245,205,.62),
      rgba(255,205,100,.16),
      rgba(255,184,65,0)
    );

  filter: blur(9px);
  pointer-events: none;
  z-index: 0;
}

/* GLOBE */

#globeViz {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* REAL HTML DESTINATION */

.destination {
  transform: translate(-50%, -50%);
  cursor: pointer;
  user-select: none;
  pointer-events: auto;

  color: #F3C94F;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;

  padding: 9px 12px;
  border-radius: 20px;

  background: rgba(5,8,24,.72);
  border: 1px solid rgba(243,201,79,.55);

  text-shadow:
    0 0 7px rgba(255,225,125,.9);

  box-shadow:
    0 0 12px rgba(243,201,79,.22);

  transition:
    color .2s ease,
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.destination:hover {
  color: #FFF1A8;

  border-color: #FFF1A8;

  background: rgba(20,17,36,.90);

  box-shadow:
    0 0 10px rgba(255,241,168,.55),
    0 0 24px rgba(243,201,79,.35);
}

.destination.selected {
  color: #FFF1A8;

  border-color: #FFF1A8;

  box-shadow:
    0 0 12px rgba(255,241,168,.70),
    0 0 30px rgba(243,201,79,.42);
}

/* CARD */

#preview {
  position: absolute;
  right: 7%;
  bottom: 10%;

  width: 270px;
  padding: 22px;

  border: 1px solid rgba(247,216,107,.55);
  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      rgba(9,16,40,.97),
      rgba(28,18,48,.96)
    );

  box-shadow:
    0 0 28px rgba(243,201,79,.20);

  color: white;

  opacity: 0;
  visibility: hidden;

  transform: translateY(12px);

  transition:
    opacity .3s ease,
    transform .3s ease,
    visibility .3s ease;

  pointer-events: none;

  z-index: 10;
}

#preview.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
}

#preview .eyebrow {
  color: #F7D86B;
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

#preview h2 {
  margin: 0 0 8px;
  color: #FFF5CF;
  font-size: 25px;
  letter-spacing: 1px;
}

#preview p {
  margin: 0 0 16px;
  color: #E6E7EF;
  font-size: 13px;
  line-height: 1.5;
}

#preview .enter {
  color: #F7D86B;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: bold;
}

/* MOBILE */

@media (max-width: 700px) {

  #preview {
    left: 50%;
    right: auto;
    bottom: 5%;
    width: 86%;
    max-width: 320px;
    transform: translate(-50%, 12px);
  }

  #preview.show {
    transform: translate(-50%, 0);
  }

  .destination {
    font-size: 13px;
    padding: 8px 10px;
  }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>

<body>

<div id="stage">

  <div id="sunGlow"></div>
  <div id="sunFlare"></div>
  <div id="sunCore"></div>

  <div id="globeViz"></div>

  <div id="preview">

    <div class="eyebrow">
      DISCOVER
    </div>

    <h2>
      WORDS
    </h2>

    <p>
      Thoughts. Stories. Sunchaslations.
    </p>

    <div class="enter">
      ENTER THE VERSE →
    </div>

  </div>

</div>

<script>

const preview =
  document.getElementById('preview');


const destinations = [
  {
    lat: 44.98,
    lng: -93.27,
    name: 'WORDS'
  }
];


/* CREATE GLOBE */

const world = Globe()
(document.getElementById('globeViz'))

.globeImageUrl(
  'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor(
  'rgba(0,0,0,0)'
)

.showAtmosphere(true)

.atmosphereColor(
  '#4969A8'
)

.atmosphereAltitude(
  0.13
);


/* =====================================
   HTML DESTINATIONS
   ===================================== */

world

.htmlElementsData(destinations)

.htmlLat('lat')

.htmlLng('lng')

.htmlAltitude(0.055)

.htmlElement(destination => {

  const button =
    document.createElement('div');

  button.className =
    'destination';

  button.textContent =
    destination.name;


  /*
    HOVER:
    VISUAL ONLY.

    It does NOT open or close the card.
  */

  button.addEventListener(
    'mouseenter',
    () => {

      world.controls()
        .autoRotateSpeed = 0.05;

    }
  );


  button.addEventListener(
    'mouseleave',
    () => {

      /*
        If destination has NOT been selected,
        resume normal rotation.

        If selected, keep the world slow.
      */

      if (!button.classList.contains('selected')) {

        world.controls()
          .autoRotateSpeed = 0.45;

      }

    }
  );


  /*
    CLICK:
    THIS is what opens the card.

    Once clicked, card visibility is no
    longer connected to hover.
  */

  button.addEventListener(
    'click',
    event => {

      event.stopPropagation();

      button.classList.add(
        'selected'
      );

      preview.classList.add(
        'show'
      );

      world.controls()
        .autoRotateSpeed = 0.05;

    }
  );


  return button;

});


/* =====================================
   OPENING VIEW
   ===================================== */

world.pointOfView(

  {
    lat: 18,
    lng: -85,
    altitude: 1.15
  },

  1000

);


/* =====================================
   MOVEMENT
   ===================================== */

world.controls()
  .autoRotate = true;

world.controls()
  .autoRotateSpeed = 0.45;

world.controls()
  .enableDamping = true;

world.controls()
  .dampingFactor = 0.08;

world.controls()
  .minDistance = 105;

world.controls()
  .maxDistance = 400;

</script>

</body>
</html>
