<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SunchaserVerse</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050818;
  font-family: Arial, sans-serif;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      #101936 0%,
      #080d20 45%,
      #03050d 100%
    );
}


/* =========================
   THE LIGHT
   ========================= */

#sunGlow {
  position: absolute;
  width: 430px;
  height: 280px;
  left: 55%;
  top: 25%;
  transform: translate(-50%, -50%);
  border-radius: 50%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,188,72,.36) 0%,
      rgba(245,157,46,.18) 28%,
      rgba(230,184,63,.07) 50%,
      rgba(230,184,63,0) 72%
    );

  filter: blur(30px);
  pointer-events: none;
  z-index: 0;
}

#sunCore {
  position: absolute;
  width: 105px;
  height: 105px;
  left: 55%;
  top: 25%;
  transform: translate(-50%, -50%);
  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,245,1) 0%,
      rgba(255,244,188,.98) 15%,
      rgba(255,196,76,.78) 35%,
      rgba(255,155,45,.32) 58%,
      rgba(255,155,45,0) 78%
    );

  filter: blur(8px);

  box-shadow:
    0 0 28px rgba(255,235,165,.60),
    0 0 65px rgba(255,176,55,.30);

  pointer-events: none;
  z-index: 0;
}

#sunFlare {
  position: absolute;
  width: 330px;
  height: 18px;
  left: 55%;
  top: 25%;
  transform: translate(-50%, -50%);

  background:
    linear-gradient(
      90deg,
      rgba(255,184,65,0),
      rgba(255,205,100,.16),
      rgba(255,245,205,.62),
      rgba(255,205,100,.16),
      rgba(255,184,65,0)
    );

  filter: blur(9px);
  pointer-events: none;
  z-index: 0;
}


/* =========================
   GLOBE
   ========================= */

#globeViz {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}


/* =========================
   DESTINATION BUTTONS
   ========================= */

.destination {
  transform: translate(-50%, -50%);
  cursor: pointer;
  user-select: none;
  pointer-events: auto;

  color: #F3C94F;

  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;

  padding: 9px 12px;
  border-radius: 20px;

  background: rgba(5,8,24,.72);

  border: 1px solid rgba(243,201,79,.55);

  text-shadow:
    0 0 7px rgba(255,225,125,.9);

  box-shadow:
    0 0 12px rgba(243,201,79,.22);

  transition:
    color .2s ease,
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.destination:hover {
  color: #FFF1A8;
  border-color: #FFF1A8;

  background: rgba(20,17,36,.90);

  box-shadow:
    0 0 10px rgba(255,241,168,.55),
    0 0 24px rgba(243,201,79,.35);
}

.destination.selected {
  color: #FFF1A8;
  border-color: #FFF1A8;

  box-shadow:
    0 0 12px rgba(255,241,168,.70),
    0 0 30px rgba(243,201,79,.42);
}


/* =========================
   DISCOVERY CARD
   ========================= */

#preview {
  position: absolute;

  right: 6%;
  top: 50%;

  width: 285px;
  padding: 22px;

  border:
    1px solid rgba(247,216,107,.55);

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      rgba(9,16,40,.97),
      rgba(28,18,48,.96)
    );

  box-shadow:
    0 0 28px rgba(243,201,79,.20);

  color: white;

  opacity: 0;
  visibility: hidden;

  transform:
    translateY(-50%)
    translateX(12px);

  transition:
    opacity .3s ease,
    transform .3s ease,
    visibility .3s ease;

  pointer-events: none;
  z-index: 10;
}

#preview.show {
  opacity: 1;
  visibility: visible;

  transform:
    translateY(-50%)
    translateX(0);

  pointer-events: auto;
}

#preview .eyebrow {
  color: #F7D86B;
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

#preview h2 {
  margin: 0 0 8px;

  color: #FFF5CF;

  font-size: 25px;
  letter-spacing: 1px;
}

#preview p {
  margin: 0 0 16px;

  color: #E6E7EF;

  font-size: 13px;
  line-height: 1.5;
}


/* =========================
   ENTER THE VERSE
   ========================= */

#preview .enter {
  display: inline-block;

  color: #F7D86B;

  font-size: 11px;
  letter-spacing: 2px;
  font-weight: bold;

  text-decoration: none;
  cursor: pointer;

  transition:
    color .2s ease,
    text-shadow .2s ease;
}

#preview .enter:hover {
  color: #FFF1A8;

  text-shadow:
    0 0 10px rgba(255,241,168,.65);
}


/* =========================
   GO HOME
   ========================= */

#homeNav {
  position: absolute;
  left: 28px;
  bottom: 28px;
  z-index: 20;

  display: inline-block;

  padding: 10px 16px;

  color: #F7D86B;
  background: rgba(5,8,24,.78);

  border: 1px solid rgba(243,201,79,.55);
  border-radius: 20px;

  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;

  text-decoration: none;

  box-shadow:
    0 0 12px rgba(243,201,79,.18);

  transition:
    color .2s ease,
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

#homeNav:hover {
  color: #FFF1A8;
  border-color: #FFF1A8;

  background: rgba(20,17,36,.92);

  box-shadow:
    0 0 10px rgba(255,241,168,.45),
    0 0 22px rgba(243,201,79,.28);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

  #preview {
    left: 50%;
    right: auto;
    top: auto;
    bottom: 5%;

    width: 86%;
    max-width: 320px;

    transform:
      translate(-50%, 12px);
  }

  #preview.show {
    transform:
      translate(-50%, 0);
  }

  .destination {
    font-size: 13px;
    padding: 8px 10px;
  }

 #homeNav {
  left: 50%;
  bottom: 80px;
  transform: translateX(-50%);

  padding: 9px 14px;

  font-size: 10px;
}
}


/* SUNCHASER CREATIVE ZONE — mystery message */
.sunshineSignature {margin-top:20px;color:#e8c77a;font:italic 13px Georgia,serif;letter-spacing:.5px}
#sunshineTrigger {position:absolute;left:50%;top:77%;transform:translateX(-50%);white-space:nowrap;z-index:25;border:1px solid #e8c77a;border-radius:24px;background:rgba(16,28,50,.94);color:#f1e8d8;padding:13px 18px;font-weight:bold;letter-spacing:1px;cursor:pointer;box-shadow:0 0 24px rgba(232,199,122,.3);font-size:13px}
#sunshineTrigger:hover,#sunshineTrigger:focus-visible {background:#203651;box-shadow:0 0 30px rgba(232,199,122,.6)}
#sunshineOverlay {position:fixed;inset:0;z-index:100;background:rgba(3,5,13,.78);display:none;align-items:center;justify-content:center;padding:20px}
#sunshineOverlay.open {display:flex}
#sunshinePanel {position:relative;width:min(440px,100%);padding:36px 26px;text-align:center;border:1px solid #e8c77a;border-radius:22px;background:linear-gradient(145deg,#101c32,#203651);color:#f1e8d8;box-shadow:0 0 55px rgba(232,199,122,.23)}
#sunshinePanel .eyebrow {font-size:11px;letter-spacing:3px;color:#e8c77a}
#sunshinePanel h2 {font:normal 30px Georgia,serif;margin:14px 0;color:#fff6df}
#sunshinePanel p {font:normal 18px/1.6 Georgia,serif;min-height:88px}
#sunshineEnvelope {font-size:54px;margin:14px auto;display:block}
#sunshineReveal,#sunshineClose {cursor:pointer;border:1px solid #e8c77a;border-radius:24px;padding:12px 20px;background:#e8c77a;color:#101c32;font-weight:bold}
#sunshineClose {position:absolute;top:12px;right:12px;border:0;background:transparent;color:#f1e8d8;font-size:23px;padding:3px 10px}
@media(max-width:700px){#sunshineTrigger{left:50%;top:78%;transform:translateX(-50%);padding:10px 12px;font-size:11px}#sunshinePanel{padding:32px 18px}#sunshinePanel h2{font-size:25px}}

/* SUNCHASER SIGNATURE — refined, grown-up sun motif */
#sunshineTrigger {display:flex;align-items:center;justify-content:center;gap:12px;top:72%;padding:18px 28px;font-size:17px;letter-spacing:2px;border-radius:40px;border-width:1.5px;background:linear-gradient(120deg,rgba(16,28,50,.97),rgba(32,54,81,.96));box-shadow:0 0 22px rgba(232,199,122,.32),inset 0 0 20px rgba(232,199,122,.06)}
#sunshineTrigger .triggerSun {font-size:27px;color:#e8c77a;line-height:1;text-shadow:0 0 14px rgba(232,199,122,.55)}
#sunshinePanel {width:min(650px,calc(100vw - 36px));min-height:460px;padding:46px 52px 42px;border-radius:26px;border:1.5px solid rgba(232,199,122,.8);background:radial-gradient(ellipse at 50% 3%,rgba(232,199,122,.13),transparent 48%),linear-gradient(145deg,#101c32,#203651 70%,#101c32);box-shadow:0 0 75px rgba(232,199,122,.23),inset 0 0 50px rgba(232,199,122,.035)}
#sunshinePanel:before,#sunshinePanel:after {content:'✦';position:absolute;color:#e8c77a;font-size:16px;opacity:.65;top:35px}
#sunshinePanel:before {left:32px}#sunshinePanel:after {right:55px}
#sunshinePanel .eyebrow {font-size:12px;letter-spacing:3.5px}
#sunshinePanel h2 {font-size:37px;margin:10px 0 16px}
#sunshinePanel p {font-size:22px;line-height:1.65;min-height:95px;max-width:520px;margin:10px auto 25px}
.sunOrnament {margin:18px auto 0;filter:drop-shadow(0 0 12px rgba(232,199,122,.23));height:104px}
#sunshineEnvelope {display:none}
#sunshineReveal {padding:15px 27px;font-size:13px;letter-spacing:1.1px}
.sunshineSignature {font-size:15px}
@media(max-width:700px){#sunshineTrigger{top:70%;padding:13px 17px;font-size:12px;letter-spacing:1px;gap:8px}#sunshineTrigger .triggerSun{font-size:20px}#sunshinePanel{min-height:410px;padding:35px 23px 30px}#sunshinePanel h2{font-size:29px}#sunshinePanel p{font-size:18px;min-height:85px}.sunOrnament{margin-top:12px}#sunshinePanel:before{left:18px}#sunshinePanel:after{right:48px}}
@media(max-height:600px){#sunshineOverlay{align-items:flex-start;overflow-y:auto}#sunshinePanel{min-height:0;margin:auto}#sunshineTrigger{top:68%}}

</style>

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>

</head>

<body>

<div id="stage">

  <div id="sunGlow"></div>
  <div id="sunFlare"></div>
  <div id="sunCore"></div>

  <div id="globeViz"></div>


  <!-- GO HOME -->

  <a
    id="homeNav"
    href="https://sunchaserunlimited.wixsite.com/my-site-1/home"
  >
    GO HOME
  </a>



  <!-- CREATIVE ZONE: INTERACTIVE MESSAGE -->
  <button id="sunshineTrigger" type="button"><span class="triggerSun" aria-hidden="true">☀</span><span>A LITTLE SUNSHINE</span></button>
  <div id="sunshineOverlay" role="dialog" aria-modal="true" aria-labelledby="sunshineTitle" aria-hidden="true">
    <div id="sunshinePanel">
      <button id="sunshineClose" type="button" aria-label="Close message">×</button>
      <div class="eyebrow">SUNCHASER'S CREATIVE ZONE</div>
      <div class="sunOrnament" aria-hidden="true"><svg viewBox="0 0 120 120" width="100" height="100"><defs><radialGradient id="sunG"><stop offset="0" stop-color="#fff9e6"/><stop offset=".5" stop-color="#f6d88d"/><stop offset="1" stop-color="#d7a44b"/></radialGradient></defs><g stroke="#e8c77a" stroke-width="1.7" stroke-linecap="round"><path d="M60 6v18M60 96v18M6 60h18M96 60h18M22 22l13 13M85 85l13 13M98 22L85 35M35 85L22 98"/><path d="M41 12l7 15M72 93l7 15M12 41l15 7M93 72l15 7M79 12l-7 15M48 93l-7 15M108 41l-15 7M27 72l-15 7" opacity=".65"/></g><circle cx="60" cy="60" r="29" fill="url(#sunG)" opacity=".96"/><circle cx="60" cy="60" r="35" fill="none" stroke="#e8c77a" stroke-opacity=".35"/></svg></div><span id="sunshineEnvelope" aria-hidden="true">✉</span>
      <h2 id="sunshineTitle">A message is waiting...</h2>
      <p id="sunshineMessage">You won't know what's inside until you open it.</p>
      <button id="sunshineReveal" type="button">OPEN YOUR MYSTERY MESSAGE</button>
      <div class="sunshineSignature">— Sunchaser Unlimited</div>
    </div>
  </div>

  <!-- DISCOVERY CARD -->

  <div id="preview">

    <div
      class="eyebrow"
      id="previewEyebrow"
    >
      DISCOVER
    </div>

    <h2 id="previewTitle">
      WORDS
    </h2>

    <p id="previewDescription">
      Thoughts. Stories. Sunchaslations.
    </p>

    <a
      class="enter"
      id="previewLink"
      href="https://sunchaserunlimited.wixsite.com/my-site-1/words"
    >
      ENTER THE VERSE →
    </a>

  </div>

</div>


<script>

/* =========================
   CARD ELEMENTS
   ========================= */

const preview =
  document.getElementById('preview');

const previewTitle =
  document.getElementById('previewTitle');

const previewDescription =
  document.getElementById('previewDescription');

const previewLink =
  document.getElementById('previewLink');


/* =========================
   DESTINATIONS
   ========================= */

const destinations = [

  {
    lat: 44.98,
    lng: -93.27,
    name: 'WORDS',

    description:
      'Thoughts. Stories. Sunchaslations.',

    url:
      'https://sunchaserunlimited.wixsite.com/my-site-1/words'
  },



  {
    lat: 40.71,
    lng: -74.01,
    name: 'JOURNAL',

    description:
      'Thoughts. Stories. Reflections. Becoming.',

    url:
      'https://sunchaserunlimited.wixsite.com/my-site-1/blog'
  },

  {
    lat: 51.51,
    lng: -0.13,
    name: 'THE LAB',

    description:
      'Raw seeds. Experiments. Possibilities.',

    url:
      'https://sunchaserunlimited.wixsite.com/my-site-1/sunchaser-lab'
  }
];


/* =========================
   CREATE GLOBE
   ========================= */

const world = Globe()

(document.getElementById('globeViz'))

.globeImageUrl(
  'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor(
  'rgba(0,0,0,0)'
)

.showAtmosphere(true)

.atmosphereColor(
  '#4969A8'
)

.atmosphereAltitude(
  0.13
);


/* =========================
   HTML DESTINATIONS
   ========================= */

world

.htmlElementsData(
  destinations
)

.htmlLat(
  'lat'
)

.htmlLng(
  'lng'
)

.htmlAltitude(
  0.055
)

.htmlElement(destination => {

  const button =
    document.createElement('div');

  button.className =
    'destination';

  button.textContent =
    destination.name;


  /* HOVER */

  button.addEventListener(
    'mouseenter',
    () => {

      world.controls()
        .autoRotateSpeed = 0.05;

    }
  );


  button.addEventListener(
    'mouseleave',
    () => {

      if (
        !button.classList.contains(
          'selected'
        )
      ) {

        world.controls()
          .autoRotateSpeed = 0.45;

      }

    }
  );


  /* CLICK DESTINATION */

  button.addEventListener(
    'click',
    event => {

      event.stopPropagation();


      /* REMOVE PREVIOUS SELECTION */

      document
        .querySelectorAll('.destination')
        .forEach(item => {

          item.classList.remove(
            'selected'
          );

        });


      /* SELECT CURRENT DESTINATION */

      button.classList.add(
        'selected'
      );


      /* UPDATE CARD */

      previewTitle.textContent =
        destination.name;

      previewDescription.textContent =
        destination.description;

      previewLink.href =
        destination.url;


      /* OPEN CARD */

      preview.classList.add(
        'show'
      );


      /* SLOW WORLD */

      world.controls()
        .autoRotateSpeed = 0.05;

    }
  );


  return button;

});


/* =========================
   OPENING VIEW
   ========================= */

world.pointOfView(

  {
    lat: 18,
    lng: -85,
    altitude: 1.15
  },

  1000

);


/* =========================
   GLOBE MOVEMENT
   ========================= */

world.controls()
  .autoRotate = true;

world.controls()
  .autoRotateSpeed = 0.45;

world.controls()
  .enableDamping = true;

world.controls()
  .dampingFactor = 0.08;

world.controls()
  .minDistance = 105;

world.controls()
  .maxDistance = 400;

</script>


<script>
/* Creative Zone — mystery envelope interaction */
(() => {
  const trigger = document.getElementById('sunshineTrigger');
  const overlay = document.getElementById('sunshineOverlay');
  const close = document.getElementById('sunshineClose');
  const reveal = document.getElementById('sunshineReveal');
  const message = document.getElementById('sunshineMessage');
  const title = document.getElementById('sunshineTitle');
  const envelope = document.getElementById('sunshineEnvelope');
  const messages = [
    ['A LITTLE SUNSHINE ☀️', "Somewhere between where you've been and where you're going, there's a beautiful little place called RIGHT NOW. Enjoy it."],
    ['A LITTLE MISCHIEF 🤭', 'I had one little idea. ONE. Now look at all these tabs I have open! Somebody come get this imagination!'],
    ['A LITTLE WISDOM 🌿', 'Not everything needs an answer today. Some things just need a little room to become.'],
    ['A LITTLE WONDER ✨', "What if the most beautiful thing about tomorrow is something you haven't even imagined yet?"],
    ['A LITTLE COURAGE 🌻', "You don't have to know the whole journey to enjoy discovering where the next step leads."],
    ['A LITTLE SUNCHASER MAGIC 🌍', 'The world is full of ordinary moments waiting for somebody curious enough to see the extraordinary.']
  ];
  let remaining = [];
  let previousIndex = -1;
  function nextMessageIndex() {
    if (!remaining.length) {
      remaining = messages.map((_, index) => index);
      if (remaining.length > 1 && previousIndex !== -1) {
        remaining = remaining.filter(index => index !== previousIndex).concat(previousIndex);
      }
    }
    const limit = remaining.length > 1 && remaining.includes(previousIndex) ? remaining.length - 1 : remaining.length;
    const pick = Math.floor(Math.random() * limit);
    const next = remaining.splice(pick, 1)[0];
    previousIndex = next;
    return next;
  }
  function openMessage() {
    title.textContent = 'A message is waiting...';
    message.textContent = "You won't know what's inside until you open it.";
    envelope.textContent = '✉';
    reveal.textContent = 'OPEN YOUR MYSTERY MESSAGE';
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    close.focus();
  }
  function closeMessage() {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    trigger.focus();
  }
  trigger.addEventListener('click', openMessage);
  close.addEventListener('click', closeMessage);
  overlay.addEventListener('click', event => { if (event.target === overlay) closeMessage(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && overlay.classList.contains('open')) closeMessage(); });
  reveal.addEventListener('click', () => {
    const next = nextMessageIndex();
    title.textContent = messages[next][0];
    message.textContent = messages[next][1];
    envelope.textContent = '✉';
    reveal.textContent = 'UNCOVER ANOTHER MESSAGE';
  });
})();
</script>

</body>
</html>
